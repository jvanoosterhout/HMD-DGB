
name: CI – Python package

on:
  push:
    branches: [main]
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  test:
    name: Test & lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install package (editable, incl. dev deps)
        run: |
          pip install -e .[dev]

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest --cov=DGB --cov-report=term-missing

  build:
    name: Build package (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: |
          python -m build

  verify-release-assets:
    name: Verify published release assets
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir release-assets
          gh release download "$TAG" --dir release-assets --pattern '*.whl' --pattern '*.tar.gz'
          test "$(find release-assets -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 1

      - name: Install uploaded wheel
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install --upgrade pip
          wheel-venv/bin/python -m pip install release-assets/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE"/wheel-venv/bin/python -c "import DGB; print(DGB.__file__)"

      - name: Install uploaded source distribution
        run: |
          python -m venv sdist-venv
          sdist-venv/bin/python -m pip install --upgrade pip
          sdist-venv/bin/python -m pip install release-assets/*.tar.gz
          cd /tmp
          "$GITHUB_WORKSPACE"/sdist-venv/bin/python -c "import DGB; print(DGB.__file__)"

version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 30

  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 30

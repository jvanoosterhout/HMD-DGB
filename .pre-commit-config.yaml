repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: ["--fix", "--show-fixes"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        types: [markdown]

  - repo: https://github.com/amperser/proselint
    rev: v0.16.0
    hooks:
      - id: proselint
        name: proselint (optional prose review)
        entry: python -X utf8 -m proselint check
        types: [markdown]
        files: ^(README\.md|AGENTS\.md|CHANGELOG\.md|\.github/.*\.md|Examples/.*\.md)$
        stages: [manual]
        verbose: true

  - repo: https://github.com/thlorenz/doctoc
    rev: v2.4.1
    hooks:
      - id: doctoc
        files: ^README\.md$
        args:
          - "--update-only"

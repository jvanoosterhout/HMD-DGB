name: Coverage report

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: coverage-report-main
  cancel-in-progress: false

jobs:
  coverage:
    name: Generate coverage data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gcc build-essential swig liblgpio-dev

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run tests and calculate coverage
        run: pytest --cov=DGB

      - name: Upload coverage data for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish coverage badge and report
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data
          path: .

      - name: Publish coverage badge and report
        uses: py-cov-action/python-coverage-comment-action@07249dd712cd2464873eb8a59a24f97fd281e76f # v4.6
        with:
          ACTIVITY: save_coverage_data_files
          GITHUB_TOKEN: ${{ github.token }}
